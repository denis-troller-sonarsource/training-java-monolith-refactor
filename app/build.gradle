plugins {
    id 'war'
    id 'io.openliberty.tools.gradle.Liberty' version '3.8.2'
}

// Preserve the historical WAR name so the Liberty server.xml application location
// (big-bad-monolith-1.0-SNAPSHOT.war) and the /big-bad-monolith context root keep working.
war {
    archiveBaseName = 'big-bad-monolith'
}

// A dedicated integration-test source set drives the ServletContextListener in its own forked
// JVM. contextDestroyed() shuts down the embedded Derby engine JVM-wide, so it must not share
// the JVM with the unit tests (which need Derby to stay up).
sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly

    // Derby JARs to install into the Liberty server's derbyLib (the server.xml <library> fileset),
    // so the JNDI jdbc/DefaultDataSource resolves instead of falling back to embedded Derby.
    derbyLib
}

dependencies {
    // Domain modules. Empty in Phase 1; code is carved into them in later phases.
    implementation project(':common')
    implementation project(':users')
    implementation project(':customers')
    implementation project(':catalog')
    implementation project(':timesheet')
    implementation project(':billing')

    compileOnly('jakarta.enterprise:jakarta.enterprise.cdi-api:4.1.0')
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')

    // JAX-RS API for the REST layer. Liberty provides the implementation at runtime via
    // jakartaee-10.0, so this is compile-only (never bundled into the WAR).
    compileOnly('jakarta.ws.rs:jakarta.ws.rs-api:3.1.0')

    // JSTL for the MVC JSP views (pure JSTL/EL, no scriptlets). The API is compile-only;
    // the Glassfish implementation is bundled into the WAR so the tags resolve even though
    // Liberty's jsp feature also provides JSTL at runtime.
    compileOnly('jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0')
    implementation('org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1')

    // Derby database
    implementation('org.apache.derby:derby:10.17.1.0')
    implementation('org.apache.derby:derbytools:10.17.1.0')

    // Connection pooling
    implementation('org.apache.commons:commons-dbcp2:2.11.0')
    implementation('org.apache.commons:commons-pool2:2.12.0')

    // Derby is needed at test runtime for the in-memory characterization DB.
    testRuntimeOnly('org.apache.derby:derby:10.17.1.0')

    // Shared in-memory DB test harness (InMemoryDatabase/Schema) from :common.
    testImplementation(testFixtures(project(':common')))

    // Servlet API is compileOnly for production (the container provides it); tests that
    // drive the ServletContextListener need it on the test classpath.
    testImplementation('jakarta.servlet:jakarta.servlet-api:6.1.0')

    // JAX-RS API on the test classpath so REST resource tests can build Response objects and
    // exercise the resources directly (no container needed).
    testImplementation('jakarta.ws.rs:jakarta.ws.rs-api:3.1.0')

    // A JAX-RS RuntimeDelegate implementation so Response.ok(...).build() works in plain unit
    // tests (Liberty supplies its own at runtime; this is test-only).
    testRuntimeOnly('org.glassfish.jersey.core:jersey-common:3.1.11')

    // Derby engine JARs installed into the Liberty derbyLib (not the WAR): derby (engine),
    // derbyshared (runtime support), derbytools (EmbeddedDriver/DataSource classes).
    derbyLib('org.apache.derby:derby:10.17.1.0')
    derbyLib('org.apache.derby:derbyshared:10.17.1.0')
    derbyLib('org.apache.derby:derbytools:10.17.1.0')
}

// Copy the Derby JARs into the Liberty server's derby/ directory so the derbyLib <library>
// fileset in server.xml resolves the embedded DataSource. Wired after libertyCreate (which
// materializes the server config dir) and before the server actually runs.
tasks.register('installDerbyLib', Copy) {
    from configurations.derbyLib
    into layout.buildDirectory.dir('wlp/usr/servers/defaultServer/derby')
}
tasks.matching { it.name == 'libertyCreate' }.configureEach { finalizedBy 'installDerbyLib' }
tasks.matching { it.name in ['libertyStart', 'libertyRun', 'libertyDev', 'libertyPackage'] }
    .configureEach { dependsOn 'installDerbyLib' }

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (servlet lifecycle) in a forked JVM.'
    group = 'verification'

    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    shouldRunAfter test
}

// CI runs `gradle build`, which invokes `check`; wire integration tests into it.
check.dependsOn integrationTest

// Sonar reads a single JaCoCo XML (bound to the `test` task). Aggregate execution data
// from BOTH `test` and `integrationTest` so servlet-lifecycle coverage is visible there.
jacocoTestReport {
    dependsOn test, integrationTest
    executionData.from = fileTree(layout.buildDirectory).include('jacoco/*.exec')
}

// Liberty configuration
liberty {
    server {
        name = 'defaultServer'
        configDirectory = file('src/main/liberty/config')
    }
}
