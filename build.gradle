plugins {
    id "org.sonarqube" version "7.3.1.8318"
}

// SonarQube analyzes the whole multi-module project from the root.
sonar {
  properties {
    property "sonar.projectKey", "denis-troller-sonarsource_training-java-monolith-refactor"
    property "sonar.organization", "denis-troller-sonar"
  }
}

allprojects {
    group 'com.sourcegraph.demo'
    version '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// Shared configuration for every code module (the root project holds no Java sources).
subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = '21'
        targetCompatibility = '21'
    }

    ext {
        junitVersion = '5.11.0'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
        testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

        // Fluent assertions for the characterization test suite.
        // 3.27.7 is the first release fixing CVE-2026-24400 (XXE, CWE-611).
        testImplementation('org.assertj:assertj-core:3.27.7')
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
        }
    }

    // Surface each module's JaCoCo XML to the aggregated Sonar analysis.
    sonar {
        properties {
            property "sonar.coverage.jacoco.xmlReportPaths",
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        }
    }
}
