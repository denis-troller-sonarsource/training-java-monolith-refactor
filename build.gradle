plugins {
    id 'java'
    id 'war'
    id 'jacoco'
    id 'io.openliberty.tools.gradle.Liberty' version '3.8.2'
    id "org.sonarqube" version "7.3.1.8318"
}

sonar {
  properties {
    property "sonar.projectKey", "denis-troller-sonarsource_training-java-monolith-refactor"
    property "sonar.organization", "denis-troller-sonar"
  }
}

group 'com.sourcegraph.demo'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.11.0'
}

sourceCompatibility = '21'
targetCompatibility = '21'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.enterprise:jakarta.enterprise.cdi-api:4.1.0')
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
    
    // Derby database
    implementation('org.apache.derby:derby:10.17.1.0')
    implementation('org.apache.derby:derbytools:10.17.1.0')
    
    // Connection pooling
    implementation('org.apache.commons:commons-dbcp2:2.11.0')
    implementation('org.apache.commons:commons-pool2:2.12.0')

    implementation('joda-time:joda-time:2.12.5')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

    // Fluent assertions for the characterization test suite.
    // 3.27.7 is the first release fixing CVE-2026-24400 (XXE, CWE-611).
    testImplementation('org.assertj:assertj-core:3.27.7')

    // Derby is needed at test runtime for the in-memory characterization DB.
    testRuntimeOnly('org.apache.derby:derby:10.17.1.0')
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

sonar {
  properties {
    property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
  }
}

// Liberty configuration
liberty {
    server {
        name = 'defaultServer'
        configDirectory = file('src/main/liberty/config')
    }
}
