plugins {
    id 'java-library'
}

// Billing + reporting. Composes the four bounded contexts via their api packages.
// Code is carved in from :app in Phase 4.
dependencies {
    api project(':common')
    implementation project(':users')
    implementation project(':customers')
    implementation project(':catalog')
    implementation project(':timesheet')

    compileOnly('jakarta.enterprise:jakarta.enterprise.cdi-api:4.1.0')

    // Shared in-memory DB test harness (InMemoryDatabase/Schema) from :common; the billing
    // tests seed real data across the context repositories against in-memory Derby.
    testImplementation(testFixtures(project(':common')))
    testRuntimeOnly('org.apache.derby:derby:10.17.1.0')
    testRuntimeOnly('org.apache.derby:derbytools:10.17.1.0')
}
